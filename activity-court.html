<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟法庭 - 政治学社</title>
    
    <!-- 只引入导航栏样式 -->
    <link rel="stylesheet" href="css/main.css">
    <!-- 引入详情页专用样式 -->
    <link rel="stylesheet" href="css/activity_MC.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo-link">
            <img src="image/logo.png" alt="政治学社" class="logo" width="120" height="auto">
        </a>
        
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">首页</a></li>
            <li><a href="index.html#section2">关于</a></li>
            <li><a href="index.html#activities">社团活动</a></li>
        </ul>
    </nav>
    
    <!-- 页面内容 - 使用普通容器而不是全屏容器 -->
    <div class="page-container">
        <!-- 返回按钮 -->
        <div class="back-button">
            <a href="index.html#activities" class="back-link">
                <span>←</span>
                返回活动列表
            </a>
        </div>
        
        <!-- 活动标题 -->
        <div class="activity-header">
            <div class="activity-title">
                <h1>模拟法庭</h1>
                <p class="activity-description">活动时间线与历史记录</p>
            </div>
            <div class="activity-tags">
                <span class="activity-tag">法律实践</span>
                <span class="activity-tag">辩论技巧</span>
                <span class="activity-tag">团队协作</span>
            </div>
        </div>
        
        <!-- 时间轴内容 -->
        <div class="timeline">
            <!-- 项目1 -->
            <div class="timeline-item">
                <div class="timeline-date">
                    <span>📅</span>
                    <span>2023年12月15日</span>
                </div>
                <h3 class="timeline-title">一次成功的活动</h3>
                <p class="timeline-description">
                    模法的大合照
                </p>
                <div class="photo-container">
                    <!-- 这里应该是实际图片，暂时用占位 -->
                    <img src="image/photo/MC/MC_1.webp" alt="政治学社活动">
                </div>
                <div class="photo-caption">新的开始</div>
            </div>
            
            
    </div>
    
    <script>
        // 导航栏交互
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.getElementById('navLinks');
            
            hamburger.addEventListener('click', function() {
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
